bcdn.net\/rsrc.php\/y9\/r\/tL_v571NdZ0.svg","contentUrl":"https:\/\/static.xx.fbcdn.net\/rsrc.php\/y9\/r\/tL_v571NdZ0.svg","caption":"Meta Logo"},{"@type":"WebSite","@id":"https:\/\/ai.meta.com\/#\/schema\/WebSite\/AI.Meta.com","name":"AI at Meta","url":"https:\/\/ai.meta.com\/","publisher":{"@id":"https:\/\/www.meta.com\/#\/schema\/Organization\/Meta"},"copyrightHolder":{"@id":"https:\/\/www.meta.com\/#\/schema\/Organization\/Meta"}},{"@type":"FAQPage","@id":"https:\/\/ai.meta.com\/research\/#\/schema\/FAQPage\/1","url":"https:\/\/ai.meta.com\/research\/","mainEntity":[{"@type":"Question","name":"What is the Advanced AI Scaling Framework?","acceptedAnswer":{"@type":"Answer","text":"This framework sets the standards and safeguards we hold our most capable models to \u2014 covering how we identify, assess and address the most severe risks before deployment. It's built around comprehensive safeguards, rigorous testing, ongoing research and a level of transparency that goes further than industry norms."}},{"@type":"Question","name":"What risks does the framework focus on?","acceptedAnswer":{"@type":"Answer","text":"The framework is focused on evaluating the most severe areas of potential risks for advanced models including cybersecurity threats, chemical and biological security and safeguarding against loss of control. As we build more agentic AI experiences, we've expanded assessments to evaluate how AI performs with greater autonomy and whether controls around that behavior work as intended. Core priorities include: comprehensive safeguards, rigorous testing, ongoing research to identify new risks and mitigation techniques."}},{"@type":"Question","name":"How do you test your models for safety?","acceptedAnswer":{"@type":"Answer","text":"We stress-test across a wide range of scenarios using automated and human-led evaluations, including adversarial probing. Models are evaluated before and after mitigations are applied to confirm safeguards work in real-world conditions \u2014 and only deployed when they meet our framework thresholds."}},{"@type":"Question","name":"How has your safety approach evolved?","acceptedAnswer":{"@type":"Answer","text":"We've moved beyond rules-based systems to teach models why something is safe \u2014 not just what is allowed. By translating guidelines across child safety, response quality and handling different viewpoints into testable principles, models can reason through situations rigid rules might never have anticipated."}},{"@type":"Question","name":"What is a Preparedness Report?","acceptedAnswer":{"@type":"Answer","text":"A document covering how each frontier model performs across safety, security, accuracy, helpfulness and user protections. We'll publish one for every frontier model \u2014 including risk assessments, evaluation results, methodology, known limitations and deployment reasoning."}}]}]}</script><meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" /><link rel="canonical" href="https://ai.meta.com/research/" /><style nonce="2mBGS2UZ">:root, .__fb-light-mode:root, .__fb-light-mode {--fds-black:#000000;--fds-black-alpha-05:rgba(0, 0, 0, 0.05);--fds-black-alpha-10:rgba(0, 0, 0, 0.1);--fds-black-alpha-15:rgba(0, 0, 0, 0.15);--fds-black-alpha-20:rgba(0, 0, 0, 0.2);--fds-black-alpha-30:rgba(0, 0, 0, 0.3);--fds-black-alpha-40:rgba(0, 0, 0, 0.4);--fds-black-alpha-50:rgba(0, 0, 0, 0.5);--fds-black-alpha-60:rgba(0, 0, 0, 0.6);--fds-black-alpha-80:rgba(0, 0, 0, 0.8);--fds-blue-05:#ECF3FF;--fds-blue-30:#AAC9FF;--fds-blue-40:#77A7FF;--fds-blue-60:#1877F2;--fds-blue-70:#2851A3;--fds-blue-80:#1D3C78;--fds-button-text:#444950;--fds-comment-background:#F2F3F5;--fds-dark-mode-gray-35:#CCCCCC;--fds-dark-mode-gray-50:#828282;--fds-dark-mode-gray-70:#4A4A4A;--fds-dark-mode-gray-80:#373737;--fds-dark-mode-gray-90:#282828;--fds-dark-mode-gray-100:#1C1C1C;--fds-gray-00:#F5F6F7;--fds-gray-05:#F2F3F5;--fds-gray-10:#EBEDF0;--fds-gray-20:#DADDE1;--fds-gray-25:#C
