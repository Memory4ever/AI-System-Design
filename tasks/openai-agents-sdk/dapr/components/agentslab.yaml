# 仅限用户自行准备的本机教学 Redis；不是生产凭据/安全配置。
# Source: https://docs.dapr.io/reference/components-reference/supported-state-stores/setup-redis/
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agentslab
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "127.0.0.1:6379"
    - name: redisPassword
      value: ""
